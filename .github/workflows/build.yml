name: Build

on:
  push:
    branches:
      - 'main'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Python 3.13
    runs-on: ubuntu-latest
    environment: build
    env:
      RSS_ID_URL: ${{ vars.RSS_ID_URL }}
      RSS_FEED_ALTERNATE_URL: ${{ vars.RSS_FEED_ALTERNATE_URL }}
      RSS_FEED_AUTHOR_NAME: ${{ vars.RSS_FEED_AUTHOR_NAME }}
      RSS_FEED_AUTHOR_EMAIL: ${{ vars.RSS_FEED_AUTHOR_EMAIL }}

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pipenv
          python --version; pip --version; pipenv --version
          pipenv requirements > requirements.txt
          pip install -r requirements.txt
      - name: Generate RSS
        id: build
        run: |
          mkdir output
          python rss.py > output/jobs.xml
      - name: Upload generated RSS as artifact
        uses: actions/upload-pages-artifact@v3
        id: deployment
        with:
          path: output

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4